name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Needed so the tagged build can attach the zip to a Release.
permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts (busybox ash, as on Android)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox-static
          fail=0
          for f in module/*.sh build.sh; do
            busybox ash -n "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done
          exit $fail

      - name: Validate module.prop
        run: |
          id=$(sed -n 's/^id=//p' module/module.prop | tail -1)
          case "$id" in
            [A-Za-z]*) ;;
            *) echo "::error::module id must start with a letter"; exit 1 ;;
          esac
          for k in id name version versionCode author description; do
            grep -q "^$k=" module/module.prop || { echo "::error::missing $k"; exit 1; }
          done

      # One build. The step used to run twice: once to package, once to check
      # that the packaging had happened.
      - name: Build zip
        run: ./build.sh

      - name: Check merged hosts (seed)
        run: |
          cp -r module /tmp/m
          sh /tmp/m/manager.sh build
          # The seed ships an empty user-hosts, so the merge must still produce a
          # valid file with the loopback lines and no half-written section.
          test -s /tmp/m/hosts || { echo "::error::hosts is empty"; exit 1; }
          for want in '127.0.0.1' '::1'; do
            grep -q "^$want" /tmp/m/hosts || { echo "::error::missing $want line"; exit 1; }
          done
          dup=$(awk '/^[0-9]/{print $2}' /tmp/m/hosts | sort | uniq -d)
          [ -z "$dup" ] || { echo "::error::duplicate hosts entries: $dup"; exit 1; }
          if grep -q '^# --- ' /tmp/m/hosts; then
            echo "::error::empty user-hosts still produced a section header"; exit 1
          fi

      - name: Verify in-page diagnostic parser
        run: |
          # collect.sh output is the only path between the device and every
          # number on screen.
          node tests/test-diag.js

      - name: Verify WebUI action flow
        run: |
          # Detection appends to the editor, one button applies, and a finished
          # action does not trigger a second invisible refresh.
          node tests/test-status.js

      - name: Verify the packaged page is self-contained
        run: |
          # The WebView loads index.html from an internal path where
          # <script src> resolution is unreliable, so the packaged copy must
          # contain diag.js inline - and only the packaged copy. The repository
          # keeps them separate.
          unzip -p dist/*.zip webroot/index.html > /tmp/idx.html
          if grep -q '<script src=' /tmp/idx.html; then
            echo "::error::packaged index.html references an external script"; exit 1
          fi
          if unzip -l dist/*.zip | grep -q 'webroot/diag.js'; then
            echo "::error::packaged page still ships a second copy of diag.js"; exit 1
          fi
          # Every function the page calls must exist in the inlined copy.
          node -e '
            const fs = require("fs");
            const s = fs.readFileSync(0, "utf8");
            for (const fn of ["parseScan","parseLink","analyse","scoreChannels","measure",
                            "measureScan","sections","parseNet","render","fillMacs",
                            "shText","b64bytes","rssiBand"]) {
              if (!s.includes("function " + fn) && !s.includes("async function " + fn))
                { console.error("missing " + fn); process.exit(1); }
            }
          ' < /tmp/idx.html
          # The build must not have touched the tracked source.
          git diff --exit-code -- module/webroot/index.html

      - name: Check merge dedup (synthetic input)
        run: |
          # One source of truth: user-hosts. A hostname listed twice must appear
          # once, and the first line must win - the old merge wrote the seen set
          # but never read it, so both lines survived.
          cp -r module /tmp/d
          printf '9.9.9.9\tgithub.com\n8.8.8.8\tgithub.com\n' > /tmp/d/user-hosts
          sh /tmp/d/manager.sh build
          n=$(awk '$2 == "github.com"' /tmp/d/hosts | wc -l)
          [ "$n" -eq 1 ] || { echo "::error::github.com appears $n times, want 1"; exit 1; }
          awk '$2 == "github.com" { print $1 }' /tmp/d/hosts | grep -qx '9.9.9.9' \
            || { echo "::error::the first entry did not win"; exit 1; }
          grep -q '^# --- ' /tmp/d/hosts || { echo "::error::layer section missing"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: dist/*.zip

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
