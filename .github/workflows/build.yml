name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Needed so the tagged build can attach the zip to a Release.
permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts (busybox ash, as on Android)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox-static
          fail=0
          for f in module/*.sh build.sh; do
            busybox ash -n "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done
          exit $fail

      - name: Validate module.prop
        run: |
          id=$(sed -n 's/^id=//p' module/module.prop | tail -1)
          case "$id" in
            [A-Za-z]*) ;;
            *) echo "::error::module id must start with a letter"; exit 1 ;;
          esac
          for k in id name version versionCode author description; do
            grep -q "^$k=" module/module.prop || { echo "::error::missing $k"; exit 1; }
          done

      - name: Build zip
        run: ./build.sh

      - name: Check merged hosts
        run: |
          cp -r module /tmp/m
          sh /tmp/m/manager.sh build
          # The seed module ships no probed-hosts and no user-hosts, so a merge
          # here legitimately produces zero layer sections. Asserting on
          # '# --- ' only tested the empty case and broke the build. What must
          # actually hold after a merge: the file parses, no hostname appears
          # twice, and the loopback lines survive.
          test -s /tmp/m/hosts || { echo "::error::hosts is empty"; exit 1; }
          dup=$(awk '/^[0-9]/{print $2}' /tmp/m/hosts | sort | uniq -d)
          [ -z "$dup" ] || { echo "::error::duplicate hosts entries: $dup"; exit 1; }
          for want in '127.0.0.1' '::1'; do
            grep -q "^$want" /tmp/m/hosts || { echo "::error::missing $want line"; exit 1; }
          done

      - name: Verify in-page diagnostic parser
        run: |
          # The WebUI parses device output itself now, so this is the only path
          # between `cmd wifi` and every number on screen.
          node tests/test-diag.js

      - name: Verify WebUI status feedback
        run: |
          # Every action must report somewhere the user can see, from any tab,
          # and the result must not be overwritten by the refresh that follows.
          node tests/test-status.js

      - name: Verify index.html is self-contained
        run: |
          # The WebView loads this from an internal path where <script src>
          # resolution is unreliable, so diag.js must be inlined - and must be
          # the current copy, not a stale one.
          ./build.sh >/dev/null
          grep -q '=== DIAG' module/webroot/index.html
          if grep -q '<script src=' module/webroot/index.html; then
            echo "::error::index.html references an external script"; exit 1
          fi
          # Every function the page calls must exist in the inlined copy.
          node -e '
            const fs = require("fs");
            const s = fs.readFileSync("module/webroot/index.html", "utf8");
            const js = s.match(/<script>([\s\S]*?)<\/script>/)[1];
            for (const fn of ["parseScan","parseLink","analyse","scoreChannels","measure","render"]) {
              if (!js.includes("function " + fn) && !js.includes("async function " + fn))
                { console.error("missing " + fn); process.exit(1); }
            }
          '

      - name: Verify diagnose output (JSON + text)
        run: |
          # Fixtures and assertions live in tests/, not inline: a nested heredoc
          # inside a YAML block scalar is unparsable, and the assertions are
          # worth reading on their own.
          sh tests/check-diag.sh

      - name: Check merge dedup (synthetic input)
        run: |
          # Real merge logic, non-empty input: a user entry must beat a probed
          # entry for the same hostname, and the domain must appear only once.
          cp -r module /tmp/d
          printf '1.1.1.1\tgithub.com\n' > /tmp/d/probed-hosts
          printf '9.9.9.9\tgithub.com\n' > /tmp/d/user-hosts
          sh /tmp/d/manager.sh build
          n=$(awk '$2 == "github.com"' /tmp/d/hosts | wc -l)
          [ "$n" -eq 1 ] || { echo "::error::github.com appears $n times, want 1"; exit 1; }
          awk '$2 == "github.com" { print $1 }' /tmp/d/hosts | grep -qx '9.9.9.9' \
            || { echo "::error::user entry did not win over probed entry"; exit 1; }
          grep -q '^# --- ' /tmp/d/hosts || { echo "::error::layer sections missing"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: dist/*.zip

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
