name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Needed so a tagged build can attach the zip to a Release.
permissions:
  contents: write

jobs:
  package:
    # Pinned, not `ubuntu-latest`: the floating label starts migrating to
    # Ubuntu 26 on 2026-10-19, and a build that silently changes its own
    # userspace is not reproducible. Bump this line deliberately.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Node 22 LTS: 20 is past end-of-life, and the runner now executes the
      # actions themselves on Node 24 anyway. This only sets the toolchain our
      # own tests run on.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # build.sh does the rest: shell syntax (dash), repository invariants,
      # all three suites, packaging, and verification of the artifact itself.
      # Keeping that logic in one script means CI and a developer's machine run
      # exactly the same checks instead of two drifting copies.
      - name: Build and test
        run: ./build.sh

      - name: Check the build did not touch the source
        run: git diff --exit-code -- module/ tests/

      - uses: actions/upload-artifact@v7
        with:
          name: module-zip
          path: dist/*.zip

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
