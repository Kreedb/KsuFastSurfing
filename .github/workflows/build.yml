name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Needed so a tagged build can attach the zip to a Release.
permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # build.sh does the rest: shell syntax (dash), repository invariants,
      # all three suites, packaging, and verification of the artifact itself.
      # Keeping that logic in one script means CI and a developer's machine run
      # exactly the same checks instead of two drifting copies.
      - name: Build and test
        run: ./build.sh

      - name: Check the build did not touch the source
        run: git diff --exit-code -- module/ tests/

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: dist/*.zip

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip